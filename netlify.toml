# =============================================================================
# Cấu hình deploy Netlify — trang lộ trình cưới Thắng & Ngọc Anh
#
# Đây là site tĩnh: chỉ cần index.html và assets/. Không dùng framework.
#
# Vì sao không publish thẳng gốc repo (publish = "."):
#   Repo còn chứa docs/nhat-ky-tinh-yeu.md là ghi chép cá nhân, và README.md.
#   Publish gốc repo sẽ đẩy cả hai file đó lên CDN công khai — ai có link đều
#   đọc được, kể cả khi repo GitHub để private.
#   Vì vậy build chỉ chép index.html + assets/ sang _site/ rồi publish _site/.
#   Cách này đảm bảo file cá nhân KHÔNG BAO GIỜ rời khỏi repo.
# =============================================================================

[build.environment]
  # Repo có package.json (Playwright cho bộ test) nên Netlify sẽ tự chạy npm
  # install trước lệnh build. Bỏ devDependencies đi cho nhanh — deploy chỉ cần
  # copy file tĩnh, không cần trình duyệt test.
  NPM_FLAGS = "--omit=dev"

[build]
  # Thư mục làm việc, tính từ gốc repo. Rỗng = gốc repo.
  # Dòng này ghi đè trường "Base directory" trên giao diện Netlify.
  base = ""

  # Chỉ chép đúng những gì cần công khai.
  # Thêm file nào cần lên web thì phải thêm vào đây, nếu không nó sẽ không được deploy.
  command = "rm -rf _site && mkdir -p _site && cp index.html an-uong.html phong-cuoi.html nhan-cuoi.html thiep-cuoi.html robots.txt _site/ && cp -r assets _site/"

  # Thư mục được đẩy lên CDN.
  publish = "_site"

# --- Chặn dự phòng ---------------------------------------------------------
# Build ở trên đã đủ để file cá nhân không lên CDN. Hai luật dưới đây là lớp
# thứ hai, phòng khi có ai đổi publish về "." trong tương lai.
# force = true để luật thắng cả khi file thật sự tồn tại ở đường dẫn đó.

[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

# --- Header bảo mật cơ bản -------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Không cho trang bị nhúng trong iframe của site khác.
    X-Frame-Options = "SAMEORIGIN"
    # Trang riêng tư. Header này mạnh hơn thẻ meta vì áp cho MỌI file,
    # kể cả ảnh, CSS, JS và PDF — thẻ meta chỉ áp được cho file HTML.
    #   noindex      : không đưa vào chỉ mục tìm kiếm
    #   nofollow     : không đi theo các link trên trang
    #   noarchive    : không lưu bản cache để người khác xem lại
    #   nosnippet    : không hiển thị đoạn trích nội dung
    #   noimageindex : không lập chỉ mục ảnh trong trang
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
